<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#151a18;color:#121917;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{-webkit-text-size-adjust:100%}
.wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.pagina{position:relative;display:block;width:100%;max-width:944px;margin:0 auto;line-height:0}
.pagina > img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;display:block;border-radius:14px;cursor:pointer;
  text-decoration:none;color:transparent;font-size:0;line-height:0;
  -webkit-tap-highlight-color:transparent;transition:box-shadow .12s ease}
.hot:hover,.hot:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 0 7px rgba(11,122,49,.55)}
.hot:focus-visible{outline:none}
.hot:active{box-shadow:0 0 0 3px rgba(255,255,255,.6)}
@media (prefers-reduced-motion:reduce){.hot{transition:none}}
.dica{display:none;position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
  z-index:9;background:rgba(18,25,23,.88);color:#fff;font-size:13px;line-height:1;
  padding:10px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.35);
  pointer-events:none;opacity:1;transition:opacity .6s ease}
.dica.off{opacity:0}
/* telas estreitas: a página mantém largura fixa e rola para o lado, para o texto
   das artes continuar legível (nada é redesenhado) */
@media (max-width:860px){
  html,body{background:#f4f3ea}
  .pagina{width:860px;max-width:none}
  .dica{display:block;bottom:18px}
}
@media print{.dica{display:none!important}}
</style>
